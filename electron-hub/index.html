<!DOCTYPE html>
<html>

<head>
    <title>NeuralPath Configuration Hub</title>
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 40px;
        }

        h1 {
            color: #38bdf8;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #logs {
            font-family: 'Consolas', monospace;
            color: #22c55e;
            height: 300px;
            overflow-y: auto;
            background: #020617;
            padding: 15px;
            border-radius: 8px;
        }

        .log-item {
            margin-bottom: 5px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 2px;
        }
    </style>
</head>

<body>
    <h1>NeuralPath Hub</h1>
    <p>Status: <span style="color: #22c55e">Active</span> | Server Port: 3000</p>

    <div class="card">
        <h2>Live Telemetry Stream</h2>
        <div id="logs">Waiting for extension data...</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const logsDiv = document.getElementById('logs');

        ipcRenderer.on('TELEMETRY_UPDATE', (event, data) => {
            const item = document.createElement('div');
            item.className = 'log-item';

            const payload = data.payload || data;
            const time = new Date(payload.timestamp).toLocaleTimeString();
            item.innerHTML = `[${time}] <b>${payload.event}</b>: ${JSON.stringify(payload.data)}`;

            logsDiv.prepend(item);
        });
    </script>
</body>

</html>
