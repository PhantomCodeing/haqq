<!DOCTYPE html>
<html>
<head>
  <title>NeuralPath Controls</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }
    h1 { font-size: 18px; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 12px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 10px;
    }
    button:hover { background: #1d4ed8; }
    .status {
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
      text-align: center;
    }
    .metrics {
        margin-top: 20px;
        padding-top: 10px;
        border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <h1>NeuralPath Pilot</h1>
  <button id="trigger-flash">✨ Helper Mode</button>
  <div class="status" id="connection-status">Connecting to Hub...</div>
  
  <div class="metrics">
    <small>Session Metrics</small>
    <div id="metrics-display">Assisted: 0 | Unassisted: 0</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
